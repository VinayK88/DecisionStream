name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python -m py_compile engine.py app.py
      - run: python engine.py --out artifacts --rows 5000 --seed 42
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: decisionstream-benchmark
          path: artifacts/
          retention-days: 30
